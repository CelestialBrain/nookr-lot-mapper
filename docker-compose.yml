services:
  postgres:
    image: postgres:16-alpine
    container_name: lotmapper-db
    environment:
      POSTGRES_USER: lotmapper
      POSTGRES_PASSWORD: lotmapper_dev
      POSTGRES_DB: lotmapper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lotmapper -d lotmapper"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
